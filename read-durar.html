<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قراءة الفائدة - الأرشيف العلمي للشيخين كمال المرزوقي وقيس الخياري</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background-color: #f9f9f9; color: #333; line-height: 1.9; }
        header { background-color: #ffffff; border-bottom: 1px solid #eaeaea; padding: 20px; text-align: center; }
        header h1 { font-size: 24px; color: #1a365d; margin-bottom: 5px; }
        header p { color: #666; font-size: 14px; margin-bottom: 12px; }
        nav { background-color: #1a365d; display: flex; justify-content: center; flex-wrap: wrap; padding: 10px; }
        nav a { color: #ffffff; text-decoration: none; padding: 8px 15px; font-size: 14px; transition: 0.3s; }
        nav a:hover { color: #cbd5e1; }
        .container { max-width: 850px; margin: 30px auto; padding: 0 20px; }
        .article-box { background: #ffffff; padding: 30px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); border-top: 4px solid #1a365d; }
        .article-title { font-size: 24px; color: #1a365d; margin-bottom: 12px; line-height: 1.5; }
        .article-meta { font-size: 14px; color: #4a5568; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid #edf2f7; display: flex; flex-wrap: wrap; gap: 15px; }
        .article-content { font-size: 17px; color: #2d3748; }
        .article-content p { margin-bottom: 16px; }
        .back-btn { display: inline-block; margin-top: 25px; background-color: #1a365d; color: #fff; padding: 8px 18px; border-radius: 4px; text-decoration: none; font-size: 14px; transition: 0.3s; }
        .back-btn:hover { background-color: #2c5282; }
    </style>
</head>
<body>

    <header>
        <h1>الأرشيف العلمي للشيخين كمال المرزوقي وقيس الخياري</h1>
        <p>قسم درر وفوائد للشيخين</p>
    </header>

    <nav>
        <a href="index.html">الرئيسية</a>
        <a href="about.html">عن الشيخين</a>
        <a href="articles.html">المقالات</a>
        <a href="lectures.html">المحاضرات والدروس</a>
        <a href="fatwas.html">الفتاوى</a>
        <a href="durar.html" style="color: #cbd5e1; font-weight: bold;">درر وفوائد للشيخين</a>
    </nav>

    <div class="container">
        <div class="article-box" id="durarBox">
            <p style="text-align: center; color: #666;">جاري تحميل المادة...</p>
        </div>
    </div>

    <script src="durar.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const box = document.getElementById("durarBox");
            const params = new URLSearchParams(window.location.search);
            const id = params.get("id");

            if (!id) {
                box.innerHTML = `
                    <p style="text-align: center; color: #666;">لم يتم تحديد مادة للعرض.</p>
                    <a href="durar.html" class="back-btn">العودة إلى درر وفوائد للشيخين</a>
                `;
                return;
            }

            const metaItem = (typeof allDurar !== "undefined")
                ? allDurar.find(item => item.id === id)
                : null;

            fetch(`data/durar/${encodeURIComponent(id)}.json`)
                .then(response => {
                    if (!response.ok) throw new Error("لم يتم العثور على ملف المحتوى");
                    return response.json();
                })
                .then(data => {
                    const title = data.title || (metaItem && metaItem.title) || "درة وفائدة";
                    const author = data.author || (metaItem && metaItem.author) || "";
                    const date = data.date || (metaItem && metaItem.date) || "";
                    const content = data.content || "";

                    document.title = `${title} - الأرشيف العلمي`;

                    box.innerHTML = `
                        <h2 class="article-title">${title}</h2>
                        <div class="article-meta">
                            ${author ? `<span><i class="fa-solid fa-user"></i> ${author}</span>` : ""}
                            ${date ? `<span><i class="fa-regular fa-calendar"></i> ${date}</span>` : ""}
                        </div>
                        <div class="article-content">${content}</div>
                        <a href="durar.html" class="back-btn"><i class="fa-solid fa-arrow-right"></i> العودة إلى درر وفوائد للشيخين</a>
                    `;
                })
                .catch(() => {
                    if (metaItem) {
                        document.title = `${metaItem.title} - الأرشيف العلمي`;
                        box.innerHTML = `
                            <h2 class="article-title">${metaItem.title}</h2>
                            <div class="article-meta">
                                ${metaItem.author ? `<span><i class="fa-solid fa-user"></i> ${metaItem.author}</span>` : ""}
                                ${metaItem.date ? `<span><i class="fa-regular fa-calendar"></i> ${metaItem.date}</span>` : ""}
                            </div>
                            <div class="article-content"><p>${metaItem.snippet || ""}</p></div>
                            <a href="durar.html" class="back-btn"><i class="fa-solid fa-arrow-right"></i> العودة إلى درر وفوائد للشيخين</a>
                        `;
                    } else {
                        box.innerHTML = `
                            <p style="text-align: center; color: #c53030;">تعذّر العثور على المادة المطلوبة.</p>
                            <a href="durar.html" class="back-btn">العودة إلى درر وفوائد للشيخين</a>
                        `;
                    }
                });
        });
    </script>
</body>
  </html>
