<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل الدرس - الأرشيف العلمي للشيخين كمال المرزوقي وقيس الخياري</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background-color: #f9f9f9; color: #333; line-height: 1.9; }
        header { background-color: #ffffff; border-bottom: 1px solid #eaeaea; padding: 20px; text-align: center; }
        header h1 { font-size: 24px; color: #1a365d; margin-bottom: 5px; }
        header p { color: #666; font-size: 14px; margin-bottom: 12px; }
        nav { background-color: #1a365d; display: flex; justify-content: center; flex-wrap: wrap; padding: 10px; }
        nav a { color: #ffffff; text-decoration: none; padding: 8px 15px; font-size: 14px; transition: 0.3s; }
        nav a:hover { color: #cbd5e1; }
        .container { max-width: 850px; margin: 35px auto; padding: 0 20px; }
        .lecture-box { background: #ffffff; padding: 30px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); border-right: 4px solid #b7791f; }
        .lecture-title { font-size: 24px; color: #1a365d; margin-bottom: 12px; line-height: 1.5; }
        .lecture-meta { font-size: 14px; color: #4a5568; margin-bottom: 24px; padding-bottom: 14px; border-bottom: 1px solid #edf2f7; display: flex; flex-wrap: wrap; gap: 15px; }
        .media-wrapper { width: 100%; margin-bottom: 24px; border-radius: 8px; overflow: hidden; background: #000; }
        .media-wrapper iframe { width: 100%; height: 380px; display: block; border: none; }
        .lecture-content p { margin-bottom: 16px; font-size: 16px; color: #2d3748; }
        .btns-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 25px; }
        .back-btn { display: inline-block; background-color: #b7791f; color: #fff; padding: 8px 18px; border-radius: 4px; text-decoration: none; font-size: 14px; transition: 0.3s; }
        .back-btn:hover { background-color: #975a16; }
        .watch-btn { display: inline-block; background-color: #1a365d; color: #fff; padding: 8px 18px; border-radius: 4px; text-decoration: none; font-size: 14px; transition: 0.3s; }
        .watch-btn:hover { background-color: #2c5282; }
        .not-found { text-align: center; padding: 30px 10px; color: #4a5568; }
        @media (max-width: 600px) {
            .media-wrapper iframe { height: 220px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>الأرشيف العلمي للشيخين كمال المرزوقي وقيس الخياري</h1>
        <p>قسم المحاضرات والدروس العلمية</p>
    </header>

    <nav>
        <a href="index.html">الرئيسية</a>
        <a href="about.html">عن الشيخين</a>
        <a href="articles.html">المقالات</a>
        <a href="lectures.html" style="color: #cbd5e1; font-weight: bold;">المحاضرات والدروس</a>
        <a href="fatwas.html">الفتاوى</a>
    </nav>

    <div class="container">
        <div class="lecture-box" id="lectureContainer">
            <div class="not-found">جاري تحميل تفاصيل الدرس...</div>
        </div>
    </div>

    <script src="lectures.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async function () {
            const container = document.getElementById("lectureContainer");
            const params = new URLSearchParams(window.location.search);
            const lectureId = params.get("id");

            if (!lectureId) {
                showNotFound("لم يتم تحديد درس لعرض تفاصيله.");
                return;
            }

            const metaFromIndex = (typeof allLectures !== "undefined")
                ? allLectures.find(item => item.id === lectureId)
                : null;

            try {
                const response = await fetch(`data/lectures/${encodeURIComponent(lectureId)}.json`);
                if (!response.ok) {
                    throw new Error("ملف الدرس غير موجود");
                }

                const lectureData = await response.json();
                const title = lectureData.title || (metaFromIndex && metaFromIndex.title) || "درس علمي";
                const author = lectureData.author || (metaFromIndex && metaFromIndex.author) || "";
                const date = lectureData.date || (metaFromIndex && metaFromIndex.date) || "";
                const mediaUrl = lectureData.mediaUrl || (metaFromIndex && metaFromIndex.mediaUrl) || "";
                const content = lectureData.content || (metaFromIndex && metaFromIndex.snippet) || "";

                let mediaHtml = "";
                if (mediaUrl) {
                    const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
                    const match = mediaUrl.match(regExp);
                    const ytId = (match && match[2].length === 11) ? match[2] : "";
                    if (ytId) {
                        mediaHtml = `
                            <div class="media-wrapper">
                                <iframe src="https://www.youtube.com/embed/${ytId}" allowfullscreen></iframe>
                            </div>
                        `;
                    }
                }

                document.title = title + " - المحاضرات والدروس";
                container.innerHTML = `
                    <h2 class="lecture-title">${title}</h2>
                    <div class="lecture-meta">
                        ${author ? `<span><strong>المحاضر:</strong> ${author}</span>` : ""}
                        ${date ? `<span><strong>التاريخ:</strong> ${date}</span>` : ""}
                    </div>
                    ${mediaHtml}
                    <div class="lecture-content">
                        ${content}
                    </div>
                    <div class="btns-row">
                        <a href="lectures.html" class="back-btn">العودة إلى المحاضرات والدروس</a>
                        ${mediaUrl ? `<a href="${mediaUrl}" target="_blank" rel="noopener noreferrer" class="watch-btn">فتح على يوتيوب</a>` : ""}
                    </div>
                `;
            } catch (err) {
                showNotFound("تعذر تحميل تفاصيل هذا الدرس، قد يكون ملفه غير منشور بعد.");
            }

            function showNotFound(message) {
                container.innerHTML = `
                    <div class="not-found">
                        <h3>الدرس المطلوب غير متوفر</h3>
                        <p>${message}</p>
                        <a href="lectures.html" class="back-btn">العودة إلى المحاضرات والدروس</a>
                    </div>
                `;
            }
        });
    </script>
</body>
      </html>
